<title>網站統計・澳洲活動優惠地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: owner-only dashboard — KPI row, one trend chart, then ranked lists in two columns. */
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --ink:#13201C; --ink-2:#3A4843; --muted:#66746F; --faint:#93A09A;
  --line:#DFE4DD; --line-2:#EAEEE8; --grid:#E6EAE4;
  --s1:#1A6FA0; --s2:#C4851A; --bar:#1A6FA0; --bar-bg:#ECF0EB;
  --bad:#B0472C; --focus:#1A6FA0;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:.03em}
.top h1 small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:400;text-transform:uppercase}
.top .ctl{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 12px;border-radius:4px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
.login h2{font-family:var(--f-display);margin:0 0 6px;font-size:20px}
.login p{margin:0 0 16px;color:var(--muted);font-size:13px}
.login input{width:100%;height:42px;border:1px solid var(--line);border-radius:6px;padding:0 12px;background:var(--paper);margin-bottom:10px}
.login .err{color:var(--bad);font-size:13px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#F6F7F5;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:28px;font-weight:500;line-height:1.2;margin-top:4px}
.kpi .s{font-size:12px;color:var(--faint);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 2px;font-size:15px;font-weight:700}
.panel .sub{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;border-radius:2px;display:inline-block}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.12);white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px}
.tip .d{color:var(--muted);font-size:11.5px}
.tip .r{display:flex;gap:8px;align-items:center}
.tip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:13px}
.rank .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .name small{color:var(--muted);margin-left:6px}
.rank .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right}
.rank .bar{grid-column:1 / -1;height:6px;border-radius:4px;background:var(--bar-bg);overflow:hidden}
.rank .bar span{display:block;height:100%;border-radius:4px;background:var(--bar)}
.none{color:var(--faint);font-size:13px;padding:6px 0}
.note{margin-top:20px;font-size:12px;color:var(--faint);line-height:1.7}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.kpi .v{font-size:24px}}
</style>

<div class="wrap">
  <div class="top">
    <h1><small>Site analytics</small>網站統計</h1>
    <div class="ctl" id="ctl" hidden>
      <div class="seg" role="group" aria-label="期間">
        <button type="button" data-days="7" aria-pressed="false">7 天</button>
        <button type="button" data-days="30" aria-pressed="true">30 天</button>
        <button type="button" data-days="90" aria-pressed="false">90 天</button>
      </div>
      <a class="btn" href="/">返回網站</a>
      <button class="btn" type="button" id="logout">登出</button>
    </div>
  </div>

  <form class="login" id="login" hidden>
    <h2>輸入統計密碼</h2>
    <p>此頁面僅供網站管理者使用。密碼僅儲存於本裝置的瀏覽器。</p>
    <p class="err" id="err" hidden></p>
    <label for="key" class="sr" hidden>密碼</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="統計密碼">
    <button class="btn primary" type="submit">查看統計</button>
  </form>

  <div id="dash" hidden>
    <div class="kpis" id="kpis"></div>
    <section class="panel">
      <h3>每日瀏覽與訪客</h3>
      <p class="sub">瀏覽：每次開啟網站；訪客：每日不重複裝置</p>
      <div class="legend"><span><i style="background:var(--s1)"></i>瀏覽</span><span><i style="background:var(--s2)"></i>訪客</span></div>
      <div class="chart" id="chart"></div>
    </section>
    <div class="grid" id="lists"></div>
    <p class="note">本統計不記錄姓名、帳號或 IP 位址；訪客編號為瀏覽器隨機產生的匿名代碼，僅用於計算每日不重複人數。時間以布里斯本時間（UTC+10）計算。</p>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = ''; try { KEY = localStorage.getItem('adm_stats_key') || ''; } catch(e) {}
let DAYS = 30, TITLES = {};
const STATE_ZH = {QLD:'昆士蘭',NSW:'新南威爾斯',VIC:'維多利亞',SA:'南澳',WA:'西澳',TAS:'塔斯馬尼亞',ACT:'坎培拉',NT:'北領地',AU:'全澳洲'};
const CATS = {all:'全部類別',festival:'節慶',music:'音樂表演',food:'美食',market:'市集',arts:'藝文展覽',sport:'運動賽事',outdoors:'戶外自然',family:'親子',shopping:'購物折扣',grocery:'超市特價',dining:'餐飲與外送',tickets:'交通與機票',entertainment:'電影與娛樂',travel:'旅遊行程',eat:'吃喝',event:'活動',shop:'購物'};
const KIND = {official:'官方',social:'社群',community:'社群論壇',news:'新聞'};
let regionNames = null; try { regionNames = new Intl.DisplayNames(['zh-Hant'], {type:'region'}); } catch(e) {}
const country = c => { try { return regionNames ? regionNames.of(c) : c; } catch(e) { return c; } };
const fmt = n => Number(n || 0).toLocaleString('en-AU');

fetch('/items.json').then(r => r.json()).then(d => { d.items.forEach(i => TITLES[i.id] = i.title_zh); }).catch(() => {}).finally(start);

function start(){ KEY ? load() : showLogin(); }
function showLogin(msg){
  $('dash').hidden = true; $('ctl').hidden = true; $('login').hidden = false;
  $('err').hidden = !msg; $('err').textContent = msg || '';
  $('key').focus();
}
$('login').addEventListener('submit', e => {
  e.preventDefault();
  KEY = $('key').value.trim();
  if (!KEY) return;
  try { localStorage.setItem('adm_stats_key', KEY); } catch(e) {}
  load();
});
$('logout').addEventListener('click', () => { KEY = ''; try { localStorage.removeItem('adm_stats_key'); } catch(e) {} showLogin(); });
document.querySelectorAll('[data-days]').forEach(b => b.addEventListener('click', () => {
  DAYS = +b.dataset.days;
  document.querySelectorAll('[data-days]').forEach(x => x.setAttribute('aria-pressed', x === b));
  load();
}));

function load(){
  fetch('/api/stats?days=' + DAYS, {headers:{'x-stats-key': KEY}, cache:'no-store'})
    .then(r => { if (r.status === 401) throw new Error('auth'); if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(render)
    .catch(err => {
      if (err.message === 'auth'){ try { localStorage.removeItem('adm_stats_key'); } catch(e) {} KEY = ''; showLogin('密碼不正確，請重新輸入。'); }
      else showLogin('讀取統計失敗（' + err.message + '），請稍後再試。');
    });
}

function render(d){
  $('login').hidden = true; $('dash').hidden = false; $('ctl').hidden = false;
  const t = d.totals;
  const per = t.visitors ? (t.views / t.visitors).toFixed(1) : '0';
  $('kpis').innerHTML = [
    ['今日瀏覽', fmt(t.today_views), '布里斯本時間'],
    ['今日訪客', fmt(t.today_visitors), '不重複裝置'],
    [DAYS + ' 天瀏覽', fmt(t.views), '平均每天 ' + fmt(Math.round(t.views / DAYS))],
    [DAYS + ' 天訪客', fmt(t.visitors), '每位訪客平均 ' + per + ' 次'],
  ].map(([l, v, s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
  chart(d.days);
  const T = d.top;
  const box = (title, sub, rows, name) => `<section class="panel"><h3>${title}</h3><p class="sub">${sub}</p>${rank(rows, name)}</section>`;
  $('lists').innerHTML = [
    box('點閱最多的項目', '於列表或地圖上開啟詳細資訊', T.open, k => esc(TITLES[k] || k)),
    box('點擊最多的來源連結', '點擊「資料來源」中的連結', T.src, k => { const [id, kind] = k.split('|'); return `${esc(TITLES[id] || id)}<small>${esc(KIND[kind] || kind || '')}</small>`; }),
    box('訪客地區', '依連線位置推估（澳洲顯示至州）', T.geo, k => { if (k.startsWith('AU-')) return esc((STATE_ZH[k.slice(3)] || k.slice(3)) + '・澳洲'); return esc(country(k) || k); }),
    box('使用裝置', '依螢幕寬度判斷', T.device, k => ({mobile:'手機', tablet:'平板', desktop:'電腦'}[k] || esc(k))),
    box('來源網站', '直接輸入網址者不列入', T.ref, k => esc(k)),
    box('搜尋關鍵字', '於搜尋框輸入的關鍵字', T.search, k => esc(k)),
    box('地區篩選', '選擇地區或點選地圖上的州', T.region, k => esc(STATE_ZH[k] || k)),
    box('社群搜尋', '點擊各社群平台搜尋按鈕的次數', T.social, k => esc(k)),
  ].join('');
}
function rank(rows, name){
  if (!rows || !rows.length) return '<div class="none">此期間尚無資料</div>';
  const max = Math.max(...rows.map(r => r.n));
  return `<ol class="rank">${rows.map(r => `<li title="${esc(r.key)}：${fmt(r.n)}"><span class="name">${name(r.key)}</span><span class="n">${fmt(r.n)}</span><span class="bar"><span style="width:${Math.max(2, r.n / max * 100).toFixed(1)}%"></span></span></li>`).join('')}</ol>`;
}

function niceMax(v){ if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function chart(days){
  const W = 1000, H = 260, L = 44, R = 12, T = 12, B = 28;
  const n = days.length, max = niceMax(Math.max(1, ...days.map(d => d.views)));
  const x = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  const y = v => T + (H - T - B) * (1 - v / max);
  const ticks = [0, max / 4, max / 2, max * 3 / 4, max].map(v => Math.round(v));
  const line = key => days.map((d, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[key]).toFixed(1)).join(' ');
  const every = Math.ceil(n / 8);
  const lab = s => { const [, m, dd] = s.split('-'); return +m + '/' + +dd; };
  const last = n - 1;
  $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每天的瀏覽與訪客折線圖">
    ${ticks.map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${fmt(v)}</text>`).join('')}
    ${days.map((d, i) => ((i % every === 0 && last - i >= every / 2) || i === last) ? `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${lab(d.day)}</text>` : '').join('')}
    <path d="${line('views')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line('visitors')}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last)}" cy="${y(days[last].views)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="${x(last)}" cy="${y(days[last].visitors)}" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
    <line id="xh" y1="${T}" y2="${H - B}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip" hidden></div>`;
  const svg = $('chart').querySelector('svg'), tip = $('tip'), xh = $('xh');
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - L) / ((W - L - R) / Math.max(1, n - 1)))));
    const d = days[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    tip.hidden = false;
    tip.style.left = (x(i) / W * r.width) + 'px';
    tip.style.top = (y(d.views) / H * r.height) + 'px';
    tip.innerHTML = `<div class="d">${lab(d.day)}</div><div class="r"><i style="background:var(--s1)"></i>瀏覽 <b class="num">${fmt(d.views)}</b></div><div class="r"><i style="background:var(--s2)"></i>訪客 <b class="num">${fmt(d.visitors)}</b></div>`;
  };
  const hit = $('hit');
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
}
})();
</script>
